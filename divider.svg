<svg xmlns="http://www.w3.org/2000/svg" width="900" height="8" viewBox="0 0 900 8" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0.5" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#e040fb"/>
      <stop offset="0.5" stop-color="#00e5ff"/>
      <stop offset="1" stop-color="#e040fb"/>
      <animate attributeName="x1" from="0" to="0.5" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="x2" from="0.5" to="1" dur="3s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="0" y="2" width="900" height="4" rx="2" fill="url(#g)" filter="url(#glow)"/>
  <circle r="4" cy="4" fill="#ffffff" filter="url(#glow)">
    <animate attributeName="cx" from="0" to="900" dur="4s" repeatCount="indefinite"/>
  </circle>
</svg>
